services:
  caddy:
    image: caddy:2-alpine
    container_name: scholarsat-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scholarsat-web
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://scholarsat:${DB_PASSWORD:-changeme_scholarsat_prod}@postgres:5432/scholarsat_prod?schema=public
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_URL=https://${DOMAIN_NAME:-scholarsat.org}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_APP_URL=https://${DOMAIN_NAME:-scholarsat.org}
      - NEXT_PUBLIC_DESMOS_API_KEY=${NEXT_PUBLIC_DESMOS_API_KEY:-dcb31709b452b1cf9dc26972add0fda6}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: scholarsat-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: scholarsat
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_scholarsat_prod}
      POSTGRES_DB: scholarsat_prod
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarsat -d scholarsat_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scholarsat-prod-redis
    restart: always
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  prod_postgres_data:
  prod_redis_data:
  caddy_data:
  caddy_config:
